<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>PING BALL</title>
    <link rel="stylesheet" href="css\estils.css">

</head>
<html>

<body>
    <div id="principal" class="frame neon">

        <div id="jugadorInfo">
            👤 <span id="nomJugador"></span>
            <button id="btnAjustes" onclick="mostrarAjustes()">⚙️</button>
        </div>

        <div id="layoutInfo">
            <p>❤️ Vidas: <span id="videsJugador">3</span></p>
            <p>⭐ Puntos: <span id="punts">0</span></p>
            <p>⏱ Tiempo: <span id="temps">0</span></p>
            <p>🎮 Nivel: <span id="nivellActual">0</span></p>
        </div>

        <canvas id="joc"></canvas>

    </div>
    <div class="ranking">

        <h2>Ranking</h2>

    </div>

    <div class="modal" id="modalNom">
        <div class="modal-content">
            <h1>PING BALL</h1>

            <h3>Introdueix el teu nom</h3>
            <input type="text" id="inputNom" placeholder="Nom del jugador">

            <button type="button" id="btnContinuar">Continuar</button>
        </div>
    </div>

    <div class="modal" id="modalAjustes">
        <div class="modal-content">
            <h1>Ajustes</h1>
            <h2>Selecciona el color de la bola</h2>
            <select id="colorBola">
                <option value="red">Vermell</option>
                <option value="blue">Blau</option>
                <option value="green">Verd</option>
                <option value="yellow">Groc</option>
                <option value="purple">Lila</option>
                <option value="orange">Taronja</option>
                <option value="white" selected>Blanc</option>
            </select>
            <h2>Selecciona el color de la pala</h2>
            <select id="colorPala">
                <option value="red">Vermell</option>
                <option value="blue">Blau</option>
                <option value="green">Verd</option>
                <option value="yellow">Groc</option>
                <option value="purple">Lila</option>
                <option value="orange">Taronja</option>
                <option value="white" selected>Blanc</option>
            </select>
            <button type="button" id="btnCamabiarNivell" onclick="cambiaNivell()">Cambiar nivell</button>
            <button type="button" id="btnGuardar" onclick="guardarAjustes()">Guardar</button>
        </div>
    </div>

    <div class="modal" id="modalNivell">
        <div class="modal-content">
            <h1>Selecciona nivell</h1>

            <button type="button" id="btnNivell1">NIVELL 1</button>
            <button type="button" id="btnNivell2">NIVELL 2</button>
            <button type="button" id="btnNivell3">NIVELL 3</button>
        </div>
    </div>
    </div>


    <div class="modal" id="modalGameOver">
        <div class="modal-content">
            <h1>GAME OVER</h1>
            <h2><span id="nomJugadorFinal"></span></h2>
            <h2>Temps: <span id="tempsFinal"></span></h2>
            <h2>Punts: <span id="puntsFinal"></span></h2>


            <button type="button" id="btnTornarJugar" onclick="tornaJugar()">Tornar a jugar</button>
            <button type="button" id="btnSortir" onclick="sortirJoc()">Sortir</button>
        </div>
    </div>
</body>


<script src="js/jquery-3.6.0.min.js"></script>
<script src="js/jquery-ui.min.js"></script>
<script src="js/joc.js"></script>
<script src="js/bola.js"></script>
<script src="js/punt.js"></script>
<script src="js/pala.js"></script>
<script src="js/totxo.js"></script>
<script src="js/mur.js"></script>
<script src="js/segment.js"></script>
<script src="js/app.js"></script>

</html>
